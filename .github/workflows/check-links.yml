name: Check links

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 15 * * 1' # Mondays 15:00 UTC
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in HTML files
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/999 are bot-blocking responses (LinkedIn, Tesla,
          # Cloudflare-fronted sites), not evidence of a dead link.
          args: >-
            --no-progress
            --base-url https://vincentsc.com
            --accept '100..=103, 200..=299, 403, 429, 999'
            --max-retries 3
            './*.html'
          fail: true
